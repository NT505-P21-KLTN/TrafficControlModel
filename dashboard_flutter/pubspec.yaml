name: traffic_control_dashboard
description: Comprehensive Traffic Light Control System Dashboard using Deep Reinforcement Learning and IoT

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Framework & Design
  cupertino_icons: ^1.0.2
  material_design_icons_flutter: ^7.0.7296
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2
  loading_animation_widget: ^1.2.0+4
  
  # State Management
  provider: ^6.1.1
  get: ^4.6.6
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  web_socket_channel: ^2.4.0
  
  # Charts & Visualization
  fl_chart: ^0.64.0
  syncfusion_flutter_charts: ^23.1.44
  syncfusion_flutter_gauges: ^23.1.44
  syncfusion_flutter_maps: ^23.1.44
  syncfusion_flutter_datagrid: ^23.1.44
  
  # Maps & Geolocation
  google_maps_flutter: ^2.5.0
  google_maps_flutter_web: ^0.5.4+2
  geolocator: ^10.1.0
  
  # Date & Time
  intl: ^0.18.1
  
  # Data Handling
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  
  # File Handling
  file_picker: ^6.1.1
  csv: ^5.0.2
  
  # Utils
  url_launcher: ^6.2.1
  path_provider: ^2.1.1
  uuid: ^4.1.0
  
  # Responsive Design
  responsive_framework: ^1.1.1
  flutter_staggered_grid_view: ^0.7.0
  
  # Real-time Updates
  socket_io_client: ^2.0.3+1
  
  # Image & Media
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  
  # Animation
  lottie: ^2.7.0
  rive: ^0.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/icons/
    - assets/data/
    - assets/fonts/
    
  fonts:
    - family: Roboto
      # fonts:
        # - asset: assets/fonts/Roboto-Regular.ttf
        # - asset: assets/fonts/Roboto-Bold.ttf
          # weight: 700
